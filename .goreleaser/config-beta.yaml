version: 2
project_name: apimetrics-beta
builds:
  - id: apimetrics-beta-darwin-amd64
    goos:
      - darwin
    goarch:
      - amd64
    targets:
      - darwin_amd64_v1
    dir: .
    main: .
    binary: apimetrics-beta
    builder: go
    tool: go
    command: build
    flags:
      - -tags=beta
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
  - id: apimetrics-beta-darwin-arm64
    goos:
      - darwin
    goarch:
      - arm64
    targets:
      - darwin_arm64_v8.0
    dir: .
    main: .
    binary: apimetrics-beta
    builder: go
    tool: go
    command: build
    flags:
      - -tags=beta
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
  - id: apimetrics-beta-linux-amd64
    goos:
      - linux
    goarch:
      - amd64
    targets:
      - linux_amd64_v1
    dir: .
    main: .
    binary: apimetrics-beta
    builder: go
    tool: go
    command: build
    flags:
      - -tags=beta
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
  - id: apimetrics-beta-linux-arm64
    goos:
      - linux
    goarch:
      - arm64
    targets:
      - linux_arm64_v8.0
    dir: .
    main: .
    binary: apimetrics-beta
    builder: go
    tool: go
    command: build
    flags:
      - -tags=beta
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CXX=aarch64-linux-gnu-g++
  - id: apimetrics-beta-windows-amd64
    goos:
      - windows
    goarch:
      - amd64
    targets:
      - windows_amd64_v1
    dir: .
    main: .
    binary: apimetrics-beta
    builder: go
    tool: go
    command: build
    flags:
      - -tags=beta
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}} -X main.builtBy=goreleaser
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
archives:
  - id: default
    builds_info:
      mode: 493
    name_template: '{{ .ProjectName }}-{{ if .IsSnapshot }}{{ .Version }}{{ else }}{{ .Major }}.{{ .Minor }}.{{ .Patch }}{{ end }}-{{ .Os }}-{{ .Arch }}'
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: license*
      - src: LICENSE*
      - src: readme*
      - src: README*
snapshot:
  version_template: '{{ .ShortCommit }}'
checksum:
  name_template: checksums.txt
  algorithm: sha256
dist: dist
gomod:
  gobinary: go
before:
  hooks:
    - go mod download
    - go test -v ./...
git:
  tag_sort: -version:refname
