overlay: 1.0.0
info:
  title: Global parameters overlay
  version: 0.0.1
actions:
  - target: "$.servers"
    update:
      - url: "https://client.apimetrics.io"
        description: "APImetrics API"
  - target: "$"
    update:
      x-speakeasy-globals:
        parameters:
          - name: apimetrics-project-id
            in: header
            schema:
              type: string
            description: "Project ID for the APImetrics project to target"
  - target: "$.paths[*][*].parameters[?(@.name == 'apimetrics-project-id')]"
    update:
      x-speakeasy-global-ref: apimetrics-project-id
      schema:
        type: string
        anyOf: ~
