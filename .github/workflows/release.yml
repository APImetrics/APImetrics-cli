name: Release

on:
  push:
    tags:
      - v0.*
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run goreleaser in --snapshot mode (developer build, no publish)'
        required: false
        type: boolean
        default: false
      mac_only:
        description: 'Only run macOS signing/builds (skip Linux docker release)'
        required: false
        type: boolean
        default: false


permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Set up GCP credentials
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > gcp-secret.json

      - name: Ensure mac signing secrets for tag releases
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -z "${{ secrets.APPLE_CERT_P12 }}" ]; then
            echo "::error::APPLE_CERT_P12 secret not configured; refusing to publish unsigned macOS artifacts on tag push."
            exit 1
          fi

      - name: Run GoReleaser (Linux)
        if: ${{ github.event.inputs.mac_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
        run: |
          set -e
          EXTRA=""
          if [ "$SNAPSHOT" = "true" ]; then
            EXTRA="--snapshot"
            echo "Running goreleaser in snapshot mode (no publish)"
          fi
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-secret.json \
            ghcr.io/goreleaser/goreleaser-cross:v1.25-v2.12.7 \
            release $EXTRA --clean --parallelism 4

      - name: Clean up GCP credentials
        if: always()
        run: rm -f gcp-secret.json

  release-macos:
    name: Build and sign macOS artifacts
    runs-on: macos-latest
    needs: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Check for Apple signing secrets
        run: |
          if [ -z "${{ secrets.APPLE_CERT_P12 }}" ]; then
            echo "WARNING: APPLE_CERT_P12 secret not found — skipping Apple code signing for this run."
            echo "::warning::APPLE_CERT_P12 secret not found — skipping Apple code signing for this run."
          else
            echo "Apple signing secrets detected; will proceed with import and signing."
          fi

      - name: Import Apple certificate and provisioning profile
        if: ${{ secrets.APPLE_CERT_P12 != '' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_PROV_PROFILE: ${{ secrets.APPLE_PROV_PROFILE }}
        run: |
          set -e
          # Decode .p12 (supports both GNU and BSD base64)
          if echo "$APPLE_CERT_P12" | base64 --decode >/dev/null 2>&1; then
            echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          else
            echo "$APPLE_CERT_P12" | base64 -D > cert.p12
          fi

          # Use a keychain in the runner temp directory and reference it explicitly
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          # Decode provisioning profile (BSD/GNU compatible)
          if echo "$APPLE_PROV_PROFILE" | base64 --decode >/dev/null 2>&1; then
            echo "$APPLE_PROV_PROFILE" | base64 --decode > profile.mobileprovision
          else
            echo "$APPLE_PROV_PROFILE" | base64 -D > profile.mobileprovision
          fi
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install GoReleaser
        run: |
          # Try install; if install fails, attempt upgrade. Fail the step if both fail so issues are visible.
          if ! brew install goreleaser/tap/goreleaser; then
            brew upgrade goreleaser/tap/goreleaser
          fi

      - name: Run GoReleaser (macOS)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          SNAPSHOT: ${{ github.event.inputs.snapshot }}
        run: |
          set -e
          EXTRA=""
          if [ "$SNAPSHOT" = "true" ]; then
            EXTRA="--snapshot"
            echo "Running goreleaser in snapshot mode (no publish)"
          fi
          goreleaser release $EXTRA --clean --parallelism 4

      - name: Clean up keychain and cert
        if: always()
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          # Delete the keychain we created (if present)
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ] || security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f cert.p12 profile.mobileprovision || true
