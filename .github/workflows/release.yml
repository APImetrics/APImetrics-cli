name: Release

on:
  push:
    tags:
      - v0.*
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run goreleaser in --snapshot mode (developer build, no publish)'
        required: false
        type: boolean
        default: false


permissions:
  contents: write

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]] && [ "${{ inputs.snapshot }}" != "true" ]; then
            echo "::error::Manual dispatch from a non-tag ref requires snapshot=true to avoid creating a broken release."
            exit 1
          fi

      - name: Set up GCP credentials
        run: echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}' > gcp-secret.json

      - name: Ensure mac signing secrets for tag releases
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var_name in APPLE_CERT_P12 APPLE_CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name secret not configured; refusing to publish unsigned macOS artifacts on tag push."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run GoReleaser (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -e
          EXTRA=""
          DRAFT=""
          if [ "$SNAPSHOT" = "true" ]; then
            EXTRA="--snapshot"
            echo "Running goreleaser in snapshot mode (no publish)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            DRAFT="--draft"
            echo "Creating draft release until macOS artifacts are signed and notarized"
          fi
          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            -e GOOGLE_APPLICATION_CREDENTIALS=/workspace/gcp-secret.json \
            ghcr.io/goreleaser/goreleaser-cross:v1.25-v2.12.7 \
            release $EXTRA $DRAFT --clean --parallelism 4

      - name: Upload macOS artifacts for signing
        if: ${{ inputs.snapshot != true }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts
          if-no-files-found: error
          path: |
            dist/*-darwin-amd64.tar.gz
            dist/*-darwin-arm64.tar.gz
            dist/checksums.txt

      - name: Clean up GCP credentials
        if: always()
        run: rm -f gcp-secret.json

  release-macos:
    name: Sign and notarize macOS artifacts
    runs-on: macos-latest
    needs: release
    if: ${{ inputs.snapshot != true }}
    timeout-minutes: 30

    steps:
      - name: Check for Apple signing secrets
        id: secrets_check
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -n "$APPLE_CERT_P12" ]; then
            echo "has_signing_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_cert=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12 not configured — skipping Apple code signing."
          fi

      - name: Import Apple certificate
        if: ${{ inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          for var_name in APPLE_CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is required when APPLE_CERT_P12 is configured."
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERT_P12" | base64 -D > cert.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Download macOS artifacts
        if: ${{ inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: macos-release-artifacts
          path: dist

      - name: Sign and notarize macOS artifacts
        if: ${{ inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
        run: |
          set -e
          for var_name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is required for signing and notarization."
              exit 1
            fi
          done
          if [ ! -f dist/checksums.txt ]; then
            echo "::error::dist/checksums.txt not found; expected macOS artifacts from Linux job."
            exit 1
          fi

          for archive in dist/*-darwin-*.tar.gz; do
            [ -f "$archive" ] || continue
            tmpdir="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmpdir"

            while IFS= read -r -d '' bin; do
              codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN_PATH" \
                --sign "$APPLE_SIGNING_IDENTITY" "$bin"

              # Notarize each binary via a zip (notarytool requires zip/dmg/pkg, not a raw binary)
              zip_dir="$(mktemp -d)"
              zip_path="$zip_dir/binary.zip"
              zip -j "$zip_path" "$bin"
              xcrun notarytool submit "$zip_path" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              rm -rf "$zip_dir"
            done < <(find "$tmpdir" -type f -perm -111 -print0)

            tar -czf "${archive}.signed" -C "$tmpdir" .
            mv "${archive}.signed" "$archive"
            rm -rf "$tmpdir"

            filename="$(basename "$archive")"
            sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
            grep -v "  $filename\$" dist/checksums.txt > dist/checksums.new || true
            printf "%s  %s\n" "$sha" "$filename" >> dist/checksums.new
            mv dist/checksums.new dist/checksums.txt
          done

      - name: Upload signed macOS artifacts
        if: ${{ inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-artifacts
          if-no-files-found: error
          path: |
            dist/*-darwin-amd64.tar.gz
            dist/*-darwin-arm64.tar.gz
            dist/checksums.txt

      - name: Replace macOS assets on GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "$GITHUB_REF_NAME" \
            dist/*-darwin-amd64.tar.gz \
            dist/*-darwin-arm64.tar.gz \
            dist/checksums.txt \
            --clobber

      - name: Publish finalized GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Clean up keychain and cert
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ] || security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f cert.p12 || true
