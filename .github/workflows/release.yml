name: Release

on:
  push:
    tags:
      # v0.* is intentional: prevents accidental production releases during
      # initial development. Update to v* when ready to ship v1.0.
      - v0.*
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Run goreleaser in --snapshot mode (developer build, no publish)'
        required: false
        type: boolean
        default: false


permissions:
  contents: write
  id-token: write  # required for Workload Identity Federation

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        env:
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]] && [ "$SNAPSHOT" != "true" ]; then
            echo "::error::Manual dispatch from a non-tag ref requires snapshot=true to avoid creating a broken release."
            exit 1
          fi

      - name: Ensure mac signing secrets for tag releases
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for var_name in APPLE_CERT_P12 APPLE_CERT_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name secret not configured; refusing to publish unsigned macOS artifacts on tag push."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Authenticate to Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true }}
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run GoReleaser (Linux)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAPSHOT: ${{ inputs.snapshot }}
        run: |
          set -e
          EXTRA=""
          if [ "$SNAPSHOT" = "true" ]; then
            EXTRA="--snapshot"
            echo "Running goreleaser in snapshot mode (no publish)"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            EXTRA="--skip publish"
            echo "Building artifacts without publishing; GitHub release and GCS upload deferred to finalization"
          fi

          # Mount WIF credentials into the container when present (tag releases only).
          CREDS_OPTS=()
          if [ -n "$GOOGLE_APPLICATION_CREDENTIALS" ]; then
            CREDS_DIR="$(dirname "$GOOGLE_APPLICATION_CREDENTIALS")"
            CREDS_OPTS=(
              -v "${CREDS_DIR}:${CREDS_DIR}:ro"
              -e GOOGLE_APPLICATION_CREDENTIALS
              -e ACTIONS_ID_TOKEN_REQUEST_URL
              -e ACTIONS_ID_TOKEN_REQUEST_TOKEN
            )
          fi

          docker run --rm \
            -v "${PWD}:/workspace" \
            -w /workspace \
            -e GITHUB_TOKEN \
            "${CREDS_OPTS[@]}" \
            ghcr.io/goreleaser/goreleaser-cross:v1.25-v2.12.7 \
            release $EXTRA --clean --parallelism 2

      - name: Create GitHub draft release
        if: ${{ startsWith(github.ref, 'refs/tags/') && inputs.snapshot != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ -f dist/CHANGELOG.md ]; then
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --draft \
              --notes-file dist/CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.tar.gz dist/*.zip dist/checksums.txt \
              --draft \
              --generate-notes
          fi

      - name: Upload release artifacts
        if: ${{ inputs.snapshot != true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/artifacts.json
            dist/metadata.json

  release-macos:
    name: Sign and notarize macOS artifacts
    runs-on: macos-latest
    needs: release
    if: ${{ inputs.snapshot != true }}
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check for Apple signing secrets
        id: secrets_check
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
        run: |
          if [ -n "$APPLE_CERT_P12" ]; then
            echo "has_signing_cert=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_cert=false" >> "$GITHUB_OUTPUT"
            echo "::warning::APPLE_CERT_P12 not configured — skipping Apple code signing."
          fi

      - name: Import Apple certificate
        if: ${{ steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          for var_name in APPLE_CERT_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is required when APPLE_CERT_P12 is configured."
              exit 1
            fi
          done

          printf '%s' "$APPLE_CERT_P12" | base64 -D > cert.p12

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security import cert.p12 -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Download release artifacts
        if: ${{ steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Sign and notarize macOS artifacts
        if: ${{ steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain-db
        run: |
          set -e
          for var_name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!var_name}" ]; then
              echo "::error::$var_name is required for signing and notarization."
              exit 1
            fi
          done
          if [ ! -f dist/checksums.txt ]; then
            echo "::error::dist/checksums.txt not found; expected macOS artifacts from Linux job."
            exit 1
          fi

          for archive in dist/*-darwin-*.tar.gz; do
            [ -f "$archive" ] || continue
            tmpdir="$(mktemp -d)"
            tar -xzf "$archive" -C "$tmpdir"

            while IFS= read -r -d '' bin; do
              codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN_PATH" \
                --sign "$APPLE_SIGNING_IDENTITY" "$bin"

              # Notarize each binary via a zip (notarytool requires zip/dmg/pkg, not a raw binary)
              zip_dir="$(mktemp -d)"
              zip_path="$zip_dir/binary.zip"
              zip -j "$zip_path" "$bin"
              xcrun notarytool submit "$zip_path" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_ID_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" \
                --wait
              rm -rf "$zip_dir"
            done < <(find "$tmpdir" -type f -perm -111 -print0)

            tar -czf "${archive}.signed" -C "$tmpdir" .
            mv "${archive}.signed" "$archive"
            rm -rf "$tmpdir"

            filename="$(basename "$archive")"
            sha="$(shasum -a 256 "$archive" | awk '{print $1}')"
            grep -v "  $filename\$" dist/checksums.txt > dist/checksums.new || true
            printf "%s  %s\n" "$sha" "$filename" >> dist/checksums.new
            mv dist/checksums.new dist/checksums.txt

            # Keep artifacts.json in sync so goreleaser publish uses signed checksums.
            python3 -c "
import json, sys
data = json.load(open('dist/artifacts.json'))
for a in data:
    if a.get('name') == sys.argv[1]:
        a.setdefault('extra', {})['Checksum'] = 'sha256:' + sys.argv[2]
with open('dist/artifacts.json', 'w') as f:
    json.dump(data, f, indent=2)
" "$filename" "$sha"
          done

      - name: Upload signed macOS artifacts
        if: ${{ steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-signed-artifacts
          if-no-files-found: error
          path: |
            dist/*-darwin-amd64.tar.gz
            dist/*-darwin-arm64.tar.gz
            dist/checksums.txt

      - name: Authenticate to Google Cloud
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Upload all artifacts to GCS
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          gsutil -m cp dist/*.tar.gz dist/*.zip dist/checksums.txt "gs://apimetrics-cli/$VERSION/"

      - name: Replace macOS assets on GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release upload "$GITHUB_REF_NAME" \
            dist/*-darwin-amd64.tar.gz \
            dist/*-darwin-arm64.tar.gz \
            dist/checksums.txt \
            --clobber

      - name: Publish finalized GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Generate Homebrew tap token
        id: tap-token
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Publish Homebrew formula
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.secrets_check.outputs.has_signing_cert == 'true' }}
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --skip build,archive,sign,checksum,sbom,announce,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}

      - name: Clean up keychain and cert
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ] || security list-keychains | grep -q "$KEYCHAIN_PATH"; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f cert.p12 || true
